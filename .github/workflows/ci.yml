name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  badge-prep:
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.4
    permissions:
      contents: read
